<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evrak Masası</title>
<meta name="description" content="PDF dosyalarını internete yüklemeden görüntüleme ve işaretleme aracı">
<meta name="theme-color" content="#0b1f36">
<!--BASLIK_EK-->
<!--STIL-->
</head>
<body>
<header class="titlebar">
  <div class="brand">
    <div class="logo" id="logo"></div>
    <div><b>Evrak Masası</b><small>Vergide Yapay Zekâ</small></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tright">
    <button class="cmdk" data-act="palet" title="Komut ara (Ctrl+K)"><span class="cmdk-i"></span><span>Bir işlem arayın…</span><kbd>Ctrl K</kbd></button>
    <button class="tbtn" data-act="tema" title="Açık / koyu tema"></button>
    <div class="offline" title="Program internet bağlantısı kullanmaz"><span class="off-i"></span>Çevrimdışı</div>
  </div>
</header>
<div class="body">
  <nav class="rail" id="rail"></nav>
  <main class="work">
    <div class="toolbar" id="toolbar"></div>
    <div class="content" id="content">
      <aside class="left" id="left"></aside>
      <section class="center" id="center"></section>
      <aside class="insp" id="insp"></aside>
    </div>
  </main>
</div>
<footer class="status" id="status"></footer>
<div class="toast" id="toast"></div>
<div class="secimcubugu" id="secimCubugu"></div>
<div class="mesgul" id="mesgul"><i class="spin"></i><span></span></div>
<div class="birak" id="birak"><div><b>Bırakın</b><span>PDF dosyaları ya da klasör</span></div></div>
<noscript><p style="padding:40px;color:#fff">Bu program için JavaScript açık olmalıdır.</p></noscript>
<!--KUTUPHANE-->
<!--BETIK-->
</body>
</html>
